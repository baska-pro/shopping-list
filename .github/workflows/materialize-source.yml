name: Materialize Shopping List Source

on:
  push:
    branches: [main]
    paths:
      - '.source-pack/**'
      - '.github/workflows/materialize-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rebuild audited source tree
        run: |
          set -euo pipefail
          cat .source-pack/part-*.b64 | base64 -d > /tmp/source.tar.xz
          mkdir -p /tmp/source
          tar -xJf /tmp/source.tar.xz -C /tmp/source
          test -f /tmp/source/shopping-list-main/package.json
          test -f /tmp/source/shopping-list-main/App.tsx
          test -f /tmp/source/shopping-list-main/LICENSE
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/source/shopping-list-main/. .

      - name: Validate source structure
        run: |
          set -euo pipefail
          test -f package.json
          test -f bun.lock
          test -f App.tsx
          test -f vite.config.ts
          test -f LICENSE
          test -f README.md
          test -f .github/workflows/ci.yml
          test -f .github/workflows/pages.yml
          test ! -d .source-pack
          test ! -d .bootstrap
          test ! -d .bootstrap2
          test ! -d .stage
          test ! -d .stage2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Production build
        run: bun run build

      - name: Commit clean source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: publish Shopping List v1.0.0 source"
          git push
