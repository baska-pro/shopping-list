name: Feature request
description: Usulkan peningkatan yang relevan untuk Shopping List
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Masalah atau kebutuhan
      description: Jelaskan kebutuhan pengguna yang ingin diselesaikan.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solusi yang diusulkan
      description: Jelaskan perilaku dan hasil yang diharapkan.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatif yang sudah dipertimbangkan
